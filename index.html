<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মেস খাতা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f8;--card:#fbfcff;--ink:#16204a;--mut:#5d6896;--pri:#2b3a8c;--bad:#c2410c;--ok:#0f7a4d;--line:#c9d0ea;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#10142a;--card:#171c38;--ink:#e6e9fa;--mut:#99a3d6;--pri:#8ea0ff;--bad:#ff9a6b;--ok:#5fd6a1;--line:#2c3563;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0 0 8px}
.mut{color:var(--mut)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button{font:inherit;color:inherit;border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:9px 11px;width:100%;margin:4px 0}
button{background:var(--pri);color:var(--bg);border-color:var(--pri);font-weight:600;cursor:pointer;width:auto}
button.ghost{background:transparent;color:var(--pri)}
button.sm{padding:3px 9px;font-size:14px;margin:0}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}
.tabs button.on{background:var(--pri);color:var(--bg)}
.login{max-width:360px;margin:12vh auto;padding:24px}
.login h1{font-size:34px;color:var(--pri)}
.err{color:var(--bad);min-height:24px}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-position:0 8px}
.sheet h3,.sheet form{background:var(--card)}
.bal{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--pri);padding-bottom:6px;margin-bottom:10px}
.bal b{font-size:40px;line-height:1.1}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.wide{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.num{text-align:right}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0}
.chk label{display:flex;gap:6px;align-items:center}
.chk input{width:auto;margin:0}
.print-only{display:none}
@media print{.noprint{display:none!important}.print-only{display:block}body{background:#fff;color:#000}.sheet{background:#fff;border-color:#999}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://ocxepcudtvexkpwznaua.supabase.co',SB_KEY='sb_publishable_LxZhiPdAn167kxau1wyd8A_uK7wORPu',CUR='€';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>CUR+' '+(+n||0).toFixed(2);
const email=p=>p.replace(/\D/g,'')+'@messbill.app';
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const today=()=>{const d=new Date();return ym(d)+'-'+String(d.getDate()).padStart(2,'0')};
const months=()=>{const r=[],d=new Date();d.setDate(1);for(let i=0;i<3;i++){r.push(ym(d));d.setMonth(d.getMonth()-1)}return r};
let me,profiles=[],items=[],deposits=[],code='',month=ym(new Date()),tab='sum';

function login(msg='',first=false){
 $('#app').innerHTML=`<div class="login"><h1>মেস খাতা</h1><p class="mut">ফোন নম্বর ও ৬ সংখ্যার পিন দিয়ে ঢুকুন</p>
 <form onsubmit="return doLogin(event,${first})">
 <input name="ph" placeholder="ফোন নম্বর (দেশের কোডসহ)" inputmode="tel" required>
 <input name="pin" type="password" placeholder="পিন (৬ সংখ্যা)" inputmode="numeric" minlength="6" maxlength="6" required>
 ${first?'<input name="nm" placeholder="আপনার নাম" required>':''}
 <button>${first?'অ্যাডমিন অ্যাকাউন্ট খুলুন':'ঢুকুন'}</button></form>
 <p class="err">${esc(msg)}</p>
 <a href="#" onclick="login('',${!first});return false">${first?'সাধারণ লগইনে ফিরুন':'প্রথমবার: অ্যাডমিন সেটআপ'}</a></div>`}
async function doLogin(e,first){
 e.preventDefault();const f=new FormData(e.target),ph=f.get('ph'),pin=f.get('pin');
 const r=first?await sb.auth.signUp({email:email(ph),password:pin,options:{data:{name:f.get('nm'),phone:ph}}})
  :await sb.auth.signInWithPassword({email:email(ph),password:pin});
 if(r.error)return login('লগইন হয়নি: '+r.error.message,first);
 start();return false}
async function start(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const r=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 me=r.data;if(!me)return login('প্রোফাইল পাওয়া যায়নি');
 await load();main()}
async function load(){
 const[p,i,d]=await Promise.all([sb.from('profiles').select('*').order('name'),sb.from('items').select('*').order('date',{ascending:false}),sb.from('deposits').select('*').order('date',{ascending:false})]);
 profiles=p.data||[];items=i.data||[];deposits=d.data||[];
 if(me.role==='admin'){const c=await sb.from('settings').select('value').eq('key','invite_code').single();code=c.data?.value||''}}
async function out(){await sb.auth.signOut();login()}

function calc(uid){
 let f=0,g=0;const rows=[],t=today();
 items.filter(x=>x.date.startsWith(month)&&x.date<=t).forEach(x=>{
  const ok=profiles.filter(p=>x.participants.includes(p.id)&&p.join_date<=x.date&&(!p.leave_date||p.leave_date>=x.date));
  if(!ok.some(p=>p.id===uid))return;
  const s=x.amount/ok.length;if(x.kind==='food')f+=s;else g+=s;rows.push({x,s})});
 const ds=deposits.filter(d=>d.member_id===uid&&d.date.startsWith(month)),p=ds.reduce((a,d)=>a+ +d.amount,0);
 return{f,g,p,bal:p-f-g,rows,ds}}
const kind=k=>k==='food'?'খাবার':'সাধারণ';

function memberView(uid){
 const c=calc(uid),m=profiles.find(x=>x.id===uid);
 return `<div class="sheet"><h3>${esc(m?.name)} · ${month}</h3>
 <div class="bal"><span>${c.bal<0?'বাকি':'উদ্বৃত্ত'}</span><b class="${c.bal<0?'bad':'ok'}">${money(Math.abs(c.bal))}</b></div>
 <div class="row"><span>খাবার</span><b>${money(c.f)}</b></div>
 <div class="row"><span>সাধারণ</span><b>${money(c.g)}</b></div>
 <div class="row"><span>মোট বিল (আজ পর্যন্ত)</span><b>${money(c.f+c.g)}</b></div>
 <div class="row"><span>মোট জমা</span><b>${money(c.p)}</b></div></div>
 <div class="sheet"><h3>বাজারের তালিকা</h3><div class="wide"><table><tr><th>তারিখ</th><th>ধরন</th><th>কী</th><th class="num">আপনার ভাগ</th></tr>
 ${c.rows.map(r=>`<tr><td>${r.x.date}</td><td>${kind(r.x.kind)}</td><td>${esc(r.x.title)}</td><td class="num">${money(r.s)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">এই মাসে এখনো কোনো বাজার নেই</td></tr>'}</table></div></div>
 <div class="sheet"><h3>জমার তালিকা</h3><div class="wide"><table>
 ${c.ds.map(d=>`<tr><td>${d.date}</td><td>${esc(d.note)}</td><td class="num">${money(d.amount)}</td></tr>`).join('')||'<tr><td class="mut">এই মাসে এখনো জমা নেই</td></tr>'}</table></div></div>`}

function main(){
 const adm=me.role==='admin';
 let body='';
 if(!adm)body=memberView(me.id);
 else if(tab==='sum')body=sumView();
 else if(tab==='mem')body=memView();
 else if(tab==='shop')body=shopView();
 else body=depView();
 $('#app').innerHTML=`<div class="bar noprint"><div><b>${esc(me.name)}</b> <span class="mut">${adm?'অ্যাডমিন':'সদস্য'}</span></div>
 <div><select onchange="month=this.value;main()" style="width:auto">${months().map(m=>`<option ${m===month?'selected':''}>${m}</option>`).join('')}</select>
 <button class="ghost sm" onclick="print()">PDF</button> <button class="ghost sm" onclick="out()">বের হন</button></div></div>
 ${adm?`<div class="tabs noprint">${[['sum','সামারি'],['mem','সদস্য'],['shop','বাজার'],['dep','জমা']].map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';main()">${t[1]}</button>`).join('')}</div>`:''}
 ${body}`}

function sumView(){
 let T=0;
 const rows=profiles.map(p=>{const c=calc(p.id);T+=c.f+c.g;return `<tr><td>${esc(p.name)}</td><td class="num">${money(c.f)}</td><td class="num">${money(c.g)}</td><td class="num">${money(c.p)}</td><td class="num ${c.bal<0?'bad':'ok'}">${c.bal<0?'বাকি ':'উদ্বৃত্ত '}${money(Math.abs(c.bal))}</td></tr>`}).join('');
 return `<div class="sheet"><h3>সবার হিসাব · ${month}</h3><div class="wide"><table><tr><th>নাম</th><th class="num">খাবার</th><th class="num">সাধারণ</th><th class="num">জমা</th><th class="num">অবস্থা</th></tr>${rows}</table></div><p>মোট খরচ (আজ পর্যন্ত): <b>${money(T)}</b></p></div>`}

function memView(){
 return `<div class="sheet noprint"><h3>নতুন সদস্য</h3><form onsubmit="return addMember(event)">
 <input name="name" placeholder="নাম" required><input name="phone" placeholder="ফোন নম্বর (দেশের কোডসহ)" inputmode="tel" required>
 <input name="pin" placeholder="পিন (৬ সংখ্যা)" inputmode="numeric" minlength="6" maxlength="6" required>
 <input name="join" type="date" value="${today()}" required><button>সদস্য যোগ করুন</button></form></div>
 <div class="sheet"><h3>সদস্যদের তালিকা</h3><div class="wide"><table><tr><th>নাম</th><th>ফোন</th><th>যোগদান</th><th></th></tr>
 ${profiles.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${p.join_date||''}${p.leave_date?' → '+p.leave_date:''}</td>
 <td class="noprint"><button class="ghost sm" onclick="editMember('${p.id}')">পিন/ফোন</button> ${p.leave_date||p.role==='admin'?'':`<button class="ghost sm" onclick="leave('${p.id}')">বিদায়</button>`}</td></tr>`).join('')}</table></div></div>`}
async function addMember(e){
 e.preventDefault();const f=new FormData(e.target);
 const c=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
 const r=await c.auth.signUp({email:email(f.get('phone')),password:f.get('pin'),options:{data:{name:f.get('name'),phone:f.get('phone'),join:f.get('join'),code}}});
 if(r.error)return alert('সদস্য যোগ হয়নি: '+r.error.message);
 alert('সদস্য যোগ হয়েছে। এই তথ্য তাকে জানিয়ে দিন:\nফোন নম্বর: '+f.get('phone')+'\nপিন: '+f.get('pin'));
 await load();main();return false}
async function leave(id){
 if(!confirm('এই সদস্যকে আজ থেকে বিদায় দেবেন? আগের হিসাব ঠিক থাকবে।'))return;
 await sb.from('profiles').update({leave_date:today()}).eq('id',id);await load();main()}

async function editMember(id){
 const p=profiles.find(x=>x.id===id);
 const ph=prompt('নতুন ফোন নম্বর (না বদলাতে চাইলে যেমন আছে তেমন রাখুন)',p.phone);if(ph===null)return;
 const pin=prompt('নতুন পিন, ঠিক ৬ সংখ্যা (না বদলাতে চাইলে ফাঁকা রাখুন)','');if(pin===null)return;
 if(pin&&!/^\d{6}$/.test(pin))return alert('পিন ঠিক ৬ সংখ্যার হতে হবে');
 const r=await sb.rpc('admin_update_member',{uid:id,new_phone:ph===p.phone?'':ph,new_pin:pin});
 if(r.error)return alert('বদলানো হয়নি: '+r.error.message);
 await load();main();
 alert('বদলানো হয়েছে।'+(ph!==p.phone?'\nনতুন ফোন নম্বর: '+ph:'')+(pin?'\nনতুন পিন: '+pin:'')+'\nএই তথ্য সদস্যকে জানিয়ে দিন।')}

function shopView(){
 const list=items.filter(x=>x.date.startsWith(month));
 return `<div class="sheet noprint"><h3>নতুন বাজার</h3><form onsubmit="return addItem(event)">
 <input name="date" type="date" value="${today()}" required>
 <select name="kind"><option value="food">খাবার</option><option value="general">সাধারণ</option></select>
 <input name="title" placeholder="কী কেনা হয়েছে" required><input name="amount" type="number" step="0.01" min="0" placeholder="অঙ্ক (${CUR})" required>
 <div class="chk">${profiles.filter(p=>!p.leave_date).map(p=>`<label><input type="checkbox" name="pp" value="${p.id}" checked>${esc(p.name)}</label>`).join('')}</div>
 <button>বাজার যোগ করুন</button></form></div>
 <div class="sheet"><h3>${month} মাসের বাজার</h3><div class="wide"><table><tr><th>তারিখ</th><th>ধরন</th><th>কী</th><th class="num">অঙ্ক</th><th></th></tr>
 ${list.map(x=>`<tr><td>${x.date}</td><td>${kind(x.kind)}</td><td>${esc(x.title)}</td><td class="num">${money(x.amount)}</td><td class="noprint"><button class="ghost sm" onclick="delItem(${x.id})">মুছুন</button></td></tr>`).join('')||'<tr><td class="mut">এই মাসে কোনো বাজার নেই</td></tr>'}</table></div></div>`}
async function addItem(e){
 e.preventDefault();const f=new FormData(e.target),pp=f.getAll('pp');
 if(!pp.length)return alert('অন্তত একজন সদস্য বাছাই করুন');
 const r=await sb.from('items').insert({date:f.get('date'),kind:f.get('kind'),title:f.get('title'),amount:f.get('amount'),participants:pp});
 if(r.error)return alert(r.error.message);await load();main();return false}
async function delItem(id){if(!confirm('এই বাজার মুছবেন?'))return;await sb.from('items').delete().eq('id',id);await load();main()}

function depView(){
 const name=id=>esc(profiles.find(p=>p.id===id)?.name);
 const list=deposits.filter(d=>d.date.startsWith(month));
 return `<div class="sheet noprint"><h3>নতুন জমা</h3><form onsubmit="return addDep(event)">
 <select name="m">${profiles.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
 <input name="date" type="date" value="${today()}" required><input name="amount" type="number" step="0.01" min="0" placeholder="অঙ্ক (${CUR})" required>
 <input name="note" placeholder="নোট (ঐচ্ছিক)"><button>জমা যোগ করুন</button></form></div>
 <div class="sheet"><h3>${month} মাসের জমা</h3><div class="wide"><table><tr><th>তারিখ</th><th>নাম</th><th class="num">অঙ্ক</th><th></th></tr>
 ${list.map(d=>`<tr><td>${d.date}</td><td>${name(d.member_id)}</td><td class="num">${money(d.amount)}</td><td class="noprint"><button class="ghost sm" onclick="editDep(${d.id},${d.amount})">এডিট</button> <button class="ghost sm" onclick="delDep(${d.id})">মুছুন</button></td></tr>`).join('')||'<tr><td class="mut">এই মাসে কোনো জমা নেই</td></tr>'}</table></div></div>`}
async function addDep(e){
 e.preventDefault();const f=new FormData(e.target);
 const r=await sb.from('deposits').insert({member_id:f.get('m'),date:f.get('date'),amount:f.get('amount'),note:f.get('note')});
 if(r.error)return alert(r.error.message);await load();main();return false}
async function editDep(id,old){
 const v=prompt('নতুন অঙ্ক',old);if(v===null||isNaN(+v))return;
 await sb.from('deposits').update({amount:+v}).eq('id',id);await load();main()}
async function delDep(id){if(!confirm('এই জমা মুছবেন?'))return;await sb.from('deposits').delete().eq('id',id);await load();main()}

start();
</script>
</body>
</html>
